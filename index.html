<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قمر الشام</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <!-- مدخلات رفع الصور المخفية المرتبطة بالـ Labels -->
    <input type="file" id="cover-file-input" accept="image/*" style="display: none !important;">
    <input type="file" id="avatar-file-input" accept="image/*" style="display: none !important;">
    <input type="file" id="bg-file-input" accept="image/*" style="display: none !important;">

    <!-- الحاوية الرئيسية للتطبيق -->
    <div class="app-container">
        
        <!-- واجهة البروفايل (Profile Card) -->
        <div id="profile-modal" class="profile-card">
            
            <!-- أزرار الإغلاق والخيارات الفائقة الشفافية -->
            <button type="button" class="btn-icon btn-close" onclick="closeProfile()">✕</button>
            <button type="button" class="btn-icon btn-options" onclick="toggleOptions()">⚙️</button>

            <!-- 1. غلاف البروفايل (270px) -->
            <div class="cover-wrapper">
                <img id="cover-img" src="" alt="غلاف" style="display:none;">
                <div class="img-actions cover-actions">
                    <label for="cover-file-input" class="action-btn" title="تغيير الغلاف">📷</label>
                    <button type="button" class="action-btn remove-btn" onclick="removeImage('cover')" title="إزالة الغلاف">✕</button>
                </div>
            </div>

            <!-- 2. الصورة الشخصية (104px تتوسط الغلاف) -->
            <div class="avatar-wrapper">
                <div id="avatar-box" class="avatar-box">
                    <img id="avatar-img" src="" alt="الصورة الشخصية" style="display:none;">
                    <span id="avatar-letter" class="avatar-letter">ع</span>
                </div>
                <div class="img-actions avatar-actions">
                    <label for="avatar-file-input" class="action-btn" title="تغيير الصورة">📷</label>
                    <button type="button" class="action-btn remove-btn" onclick="removeImage('avatar')" title="إزالة الصورة">✕</button>
                </div>
            </div>

            <!-- 3. خلفية البروفايل والبيانات -->
            <div id="profile-bg-layer" class="profile-bg-layer">
                <div class="img-actions bg-actions">
                    <label for="bg-file-input" class="action-btn" title="تغيير الخلفية">📷</label>
                    <button type="button" class="action-btn remove-btn" onclick="removeImage('background')" title="إزالة الخلفية">✕</button>
                </div>

                <!-- الاسم والتعريف الرمزي -->
                <div class="user-info-section">
                    <div class="name-edit-row">
                        <input type="text" id="profile-display-name" value="عماد" readonly>
                        <button type="button" class="btn-icon-inline" onclick="toggleNameEdit()">✏️</button>
                    </div>
                    
                    <div class="bio-row">
                        <input type="text" id="profile-bio" maxlength="20" placeholder="التعريف الرمزي (20 حرف كحد أقصى)...">
                    </div>
                </div>

                <!-- لوحة التخصيص (تظهر بضغط ⚙️) -->
                <div id="customization-panel" class="customization-panel" style="display:none;">
                    <div class="control-group">
                        <label>عرض الاسم</label>
                        <input type="range" id="name-width-range" min="50" max="200" value="100">
                    </div>
                    <div class="control-group">
                        <label>طول الاسم</label>
                        <input type="range" id="name-height-range" min="50" max="200" value="100">
                    </div>
                    
                    <div class="options-grid">
                        <button type="button" onclick="openFontPicker()">الخطوط (10)</button>
                        <button type="button" onclick="openColorPicker('text')">لون الاسم (50)</button>
                        <button type="button" onclick="openColorPicker('bg')">خلفية الاسم (شات)</button>
                        <button type="button" onclick="openEffectsPicker()">التأثيرات (22)</button>
                        <button type="button" onclick="openFramesPicker()">الإطارات (شات)</button>
                    </div>
                </div>

                <!-- زر الحفظ أقصى اليمين السفلي شبه شفاف -->
                <button type="button" class="btn-save-bottom" onclick="saveProfile()">💾 حفظ</button>
            </div>
        </div>

        <!-- منطقة الشات التجريبية -->
        <div class="chat-box" id="chat-messages"></div>
        <div class="input-bar">
            <input type="text" id="chat-input" placeholder="اكتب رسالة...">
            <button onclick="sendMessage()">إرسال</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
