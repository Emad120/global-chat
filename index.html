<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 قمر الشام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="container">
        <div class="login-screen" id="login-screen">
            <div class="login-box">
                <div class="logo">
                    <div class="logo-icon">🌙</div>
                    <h1>قمر الشام</h1>
                    <p>منصة الشات الملكية الفاخرة</p>
                </div>
                <div class="input-group">
                    <label>👤 اسمك الكريم</label>
                    <input type="text" id="username-input" placeholder="اكتب اسمك هنا..." maxlength="20">
                </div>
                <button class="btn-primary" onclick="joinChat()">
                    <span>دخول</span>
                    <span>🚪</span>
                </button>
            </div>
        </div>

        <div class="chat-screen" id="chat-screen" style="display:none">
            <div class="header">
                <div class="room-info">
                    <div class="room-avatar">🌙</div>
                    <div>
                        <h3>قمر الشام</h3>
                        <span class="online-status">
                            <span class="online-dot"></span>
                            <span>متصل</span>
                        </span>
                    </div>
                </div>
                <button class="btn-leave" onclick="leaveChat()">خروج</button>
            </div>
            
            <div class="messages" id="messages"></div>
            
            <div class="input-area">
                <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." maxlength="500">
                <button class="btn-send" onclick="sendMessage()">إرسال 📨</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
