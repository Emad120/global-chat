<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشات العالمي</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <div class="login-screen" id="login-screen">
            <div class="login-box">
                <h2>💬 الشات العالمي</h2>
                <input type="text" id="username-input" placeholder="اسمك" maxlength="20">
                <input type="text" id="room-input" placeholder="اسم الغرفة" value="general">
                <button onclick="joinRoom()">دخول</button>
            </div>
        </div>

        <div class="chat-screen" id="chat-screen" style="display:none">
            <div class="header">
                <h3 id="room-name"></h3>
                <span id="user-count"></span>
            </div>
            <div class="main-content">
                <div class="messages" id="messages"></div>
                <div class="users-panel">
                    <h4>المستخدمون</h4>
                    <div id="users-list"></div>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="اكتب رسالتك..." maxlength="500">
                <button onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
