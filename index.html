<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 قمر الشام - منصة الشات الملكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="container">
        <!-- شاشة الدخول -->
        <div class="login-screen" id="login-screen">
            <div class="login-box">
                <div class="logo">
                    <div class="logo-icon">🌙</div>
                    <h1>قمر الشام</h1>
                    <p>منصة الشات الملكية الفاخرة</p>
                </div>
                
                <div class="login-tabs">
                    <button class="tab-btn active" onclick="switchTab('login')">دخول</button>
                    <button class="tab-btn" onclick="switchTab('register')">تسجيل</button>
                    <button class="tab-btn" onclick="switchTab('guest')">زائر</button>
                </div>
                
                <div class="tab-content" id="tab-login">
                    <div class="input-group">
                        <label>👤 الاسم أو الإيميل</label>
                        <input type="text" id="login-username" placeholder="اكتب اسمك أو إيميلك...">
                    </div>
                    <div class="input-group">
                        <label>🔑 كلمة السر</label>
                        <input type="password" id="login-password" placeholder="كلمة السر...">
                    </div>
                    <button class="btn-primary" onclick="loginUser()">
                        <span>دخول</span>
                        <span>🚪</span>
                    </button>
                </div>
                
                <div class="tab-content" id="tab-register" style="display:none">
                    <div class="input-group">
                        <label>👤 الاسم</label>
                        <input type="text" id="reg-username" placeholder="اسمك...">
                    </div>
                    <div class="input-group">
                        <label>📧 الإيميل</label>
                        <input type="email" id="reg-email" placeholder="example@email.com">
                    </div>
                    <div class="input-group">
                        <label>🔑 كلمة السر</label>
                        <input type="password" id="reg-password" placeholder="كلمة السر...">
                    </div>
                    <div class="input-group">
                        <label>🔑 تأكيد كلمة السر</label>
                        <input type="password" id="reg-confirm" placeholder="أعد كلمة السر...">
                    </div>
                    <button class="btn-primary" onclick="registerUser()">
                        <span>تسجيل</span>
                        <span>📝</span>
                    </button>
                </div>
                
                <div class="tab-content" id="tab-guest" style="display:none">
                    <div class="input-group">
                        <label>👤 الاسم</label>
                        <input type="text" id="guest-username" placeholder="اسمك...">
                    </div>
                    <div class="input-group">
                        <label>🎂 العمر</label>
                        <input type="number" id="guest-age" placeholder="عمرك..." min="10" max="99">
                    </div>
                    <div class="input-group">
                        <label>⚧️ الجنس</label>
                        <select id="guest-gender">
                            <option value="male">ذكر</option>
                            <option value="female">أنثى</option>
                        </select>
                    </div>
                    <button class="btn-primary" onclick="guestLogin()">
                        <span>دخول كزائر</span>
                        <span>👤</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- شاشة الشات -->
        <div class="chat-screen" id="chat-screen" style="display:none">
            <div class="header">
                <button class="btn-icon" onclick="toggleRooms(event)">📂</button>
                <h3 id="room-title">🌙 قمر الشام - الروم العام</h3>
                <div class="header-actions">
                    <button class="btn-icon" onclick="toggleNotifications(event)">🔔</button>
                    <button class="btn-icon" onclick="togglePrivate(event)">💬</button>
                    <button class="btn-icon" id="memory-btn" style="display:none" onclick="toggleMemory(event)">🧠</button>
                    <button class="btn-icon" onclick="toggleProfile(event)">👤</button>
                    <button class="btn-icon" onclick="toggleMenu(event)">☰</button>
                </div>
            </div>
            
            <div class="mics-bar" id="mics-bar">
                <div class="mics">
                    <div class="mic" id="mic1">🎙️</div>
                    <div class="mic" id="mic2">🎙️</div>
                    <div class="mic" id="mic3">🎙️</div>
                    <div class="mic" id="mic4">🎙️</div>
                </div>
                <button class="btn-icon" onclick="toggleMics()">▼</button>
            </div>
            
            <div class="main-content">
                <div class="messages" id="messages"></div>
            </div>
            
            <div class="input-area">
                <button class="btn-icon" onclick="copyRoomLink()">🔗</button>
                <input type="text" id="message-input" placeholder="اكتب رسالتك هنا...">
                <button class="btn-send" onclick="sendMessage()">إرسال 📨</button>
            </div>
        </div>
    </div>

    <!-- القائمة اليسار -->
    <div class="sidebar left-sidebar" id="left-sidebar">
        <div class="sidebar-header">
            <h3>القائمة</h3>
            <button class="btn-close" onclick="closeSidebar('left-sidebar')">✕</button>
        </div>
        <div class="sidebar-content">
            <button class="sidebar-item" onclick="showAlert('تفاعل الرومات - قريباً')">🏠 تفاعل الرومات</button>
            <button class="sidebar-item" onclick="showAlert('تفاعل الأعضاء - قريباً')">👥 تفاعل الأعضاء</button>
            <button class="sidebar-item" onclick="showAlert('تفاعل العائلات - قريباً')">👨‍👩‍👧‍👦 تفاعل العائلات</button>
            <button class="sidebar-item" id="memory-sidebar-item" style="display:none" onclick="toggleMemory(event)">🧠 ذاكرة البوت</button>
            <button class="sidebar-item" onclick="showAlert('حائط النشر العام - قريباً')">📢 حائط نشر عام</button>
            <button class="sidebar-item" onclick="showAlert('حائط نشر الأصدقاء - قريباً')">💬 حائط نشر الأصدقاء</button>
        </div>
    </div>

    <!-- القائمة اليمين -->
    <div class="sidebar right-sidebar" id="right-sidebar">
        <div class="sidebar-header">
            <h3>الرومات</h3>
            <button class="btn-close" onclick="closeSidebar('right-sidebar')">✕</button>
        </div>
        <div class="sidebar-content">
            <button class="sidebar-item active" onclick="showAlert('الروم العام')">🌙 الروم العام</button>
            <button class="sidebar-item" id="private-room-item" style="display:none" onclick="showAlert('الروم الخاص مع البوت')">🤖 الروم الخاص مع البوت</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeAllSidebars()"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
