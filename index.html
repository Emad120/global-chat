<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدردشة العامة</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <div class="container">
    <h1>الدردشة العامة</h1>

    <!-- قسم الانضمام -->
    <div id="login-section">
      <h3>الانضمام إلى الشات</h3>
      <div class="controls-group">
        <input type="text" id="username" placeholder="وين الحكي (اسم المستخدم)">
        <select id="room-select">
          <option value="الفرقة العامة">الغرفة العامة</option>
        </select>
        <button id="join-btn">انضمام</button>
      </div>
    </div>

    <hr style="border-color: #334155; margin: 10px 0;">

    <!-- قسم الغرف والصوت -->
    <div class="controls-group">
      <button class="btn-secondary">+ غرفة جديدة</button>
      <button class="btn-secondary">🎤 تفعيل الصوت</button>
      <button class="btn-secondary" style="background: #ef4444;">مغادرة</button>
    </div>

    <!-- منطقة عرض الرسائل -->
    <div id="chat-messages" class="messages-box">
      <div class="message">أهلاً بك في الدردشة! اكتب رسالتك بالأسفل.</div>
    </div>

    <!-- كتابة وإرسال الرسائل -->
    <div class="chat-input-group">
      <input type="text" id="message-input" placeholder="وين الحديث...">
      <button id="send-btn">إرسال</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
